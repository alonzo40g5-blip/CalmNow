name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the project (unzip if needed)
        run: |
          find_settings() {
            find . -name "settings.gradle.kts" -not -path "*/.*" | head -n 1
          }
          SETTINGS=$(find_settings)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -name "*.zip" -not -path "*/.*" | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "No project files found, but found $ZIP — extracting it."
              unzip -q "$ZIP" -d _unzipped
              SETTINGS=$(find_settings)
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle.kts and no zip found. Upload CalmNow.zip to the repo."
            echo "Files currently in the repo:"
            find . -maxdepth 2 -not -path "*/.*"
            exit 1
          fi
          echo "Building project at: $(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: mv "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$PROJECT_DIR/app/build/outputs/apk/debug/CalmNow.apk"

      - name: Upload APK (downloads as a zip)
        uses: actions/upload-artifact@v4
        with:
          name: CalmNow-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/CalmNow.apk
